name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm --dir extension install --frozen-lockfile
      - run: node --test tests/repository-boundary.test.mjs
      - run: pnpm --dir extension test
      - run: pnpm --dir extension compile
      - run: pnpm --dir extension build
      - run: pnpm --dir extension build:edge
      - run: node scripts/audit-source.mjs
