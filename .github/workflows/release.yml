name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Verify source and build
        run: bash scripts/verify-release.sh
      - name: Build browser ZIP files
        run: |
          pnpm --dir extension zip
          pnpm --dir extension zip:edge
      - name: Resolve release metadata
        id: release
        run: node scripts/prepare-release-assets.mjs --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Verify and stage release assets
        run: |
          mkdir -p release-artifacts
          cp "${{ steps.release.outputs.chrome_source }}" "release-artifacts/${{ steps.release.outputs.chrome_asset }}"
          cp "${{ steps.release.outputs.edge_source }}" "release-artifacts/${{ steps.release.outputs.edge_asset }}"
          node scripts/verify-package.mjs \
            "release-artifacts/${{ steps.release.outputs.chrome_asset }}" \
            "release-artifacts/${{ steps.release.outputs.edge_asset }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.zip \
            --verify-tag \
            --generate-notes \
            --title "ChartViz $GITHUB_REF_NAME"
